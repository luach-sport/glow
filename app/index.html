<meta name="description" content="Glow – רקע חדש. כוח חדש. מחליף לבד רקעים למסך הבית ולמסך הנעילה, עם משפטי מוטיבציה וחיזוק.">
<title>Glow</title>
<link rel="icon" href="icon.png">
<meta name="format-detection" content="telephone=no">
<script>
  (function () {
    try {
      var t = localStorage.getItem('glow.theme') || 'system';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
